[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-text"
version = "0.1.0"
description = "Read the quran-text dataset: the Qurʾān in seven riwāyāt with pages, lines, āyāt, waqf marks and one shared word numbering. Ḥafṣ bundled."
requires-python = ">=3.9"
license = { text = "MIT AND CC-BY-4.0" }
readme = "README.md"
authors = [{ name = "quran-ws", email = "service@quran.ws" }]
keywords = ["quran", "mushaf", "hafs", "warsh", "qalun", "riwayahs", "arabic", "rasm_uthmani"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
  "Natural Language :: Arabic",
]

[project.urls]
Homepage = "https://quran.ws"
Repository = "https://github.com/quran-ws/quran-text"
Issues = "https://github.com/quran-ws/quran-text/issues"

[tool.setuptools]
py-modules = ["quran_text"]
packages = ["quran_text_data"]

[tool.setuptools.package-data]
quran_text_data = ["hafs.json", "UthmanicHafs-v-3.0.ttf"]
