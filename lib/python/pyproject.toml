[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-text"
version = "0.1.0"
description = "Read the quran-text dataset: the Qurʾān in seven riwāyāt with pages, lines, āyāt, pause marks and one shared word numbering. Ḥafṣ bundled."
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
py-modules = ["quran_text"]
packages = ["quran_text_data"]

[tool.setuptools.package-data]
quran_text_data = ["hafs.json", "UthmanicHafs-v-3.0.ttf"]
