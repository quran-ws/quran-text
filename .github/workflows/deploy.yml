# Builds the download service in `service/` and deploys it to text.quran.ws.
#
# The image is built from the repository root so that `lib/` and `data/` are in
# the context — see service/Dockerfile. `data/` is ~135 MB, so the image is
# correspondingly large and the site manifest asks for more memory than the
# static sites do.
#
# Copied from quran.ws-server's docs/site-templates/_site-deploy.yml with
# SLUG and INFRA_REPO filled in.
#
# Requires (both are one-time, human-only steps — see docs/DEPLOY.md):
#   - A self-hosted runner registered for THIS repo on quran-ws-01.
#   - A repo secret `INFRA_REPO_PAT`: fine-grained PAT with
#     `Contents: write` + `Pull requests: write` on the infra repo.
#
# Flow:
#   push main -> build image -> push to GHCR
#            -> open image-bump PR in infra repo (auto-merge enabled)
#            -> infra's validate runs -> auto-merge fires
#            -> infra's deploy classifies as image-only -> deploys live.
#
# The staging site must exist in the infra repo first: an image-bump PR only
# rewrites the `image:` line of an existing infra/sites/<SLUG>/site.yaml.

name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: text
  INFRA_REPO: AbdullahObaid/quran.ws-server
  INFRA_BRANCH: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, quran-ws-01]
    outputs:
      image: ${{ steps.meta.outputs.image }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          image="ghcr.io/${{ github.repository }}:sha-$short_sha"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: keep `with:` in block form. Inline flow-map form
          # `with: { registry: ..., ... ${{ github.actor }} ... }` breaks
          # YAML parsing because `{{` inside `{}` confuses the parser.

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./service/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  bump:
    needs: build
    runs-on: [self-hosted, quran-ws-01]
    steps:
      - name: open image-bump PR in infra repo
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_PAT }}
          IMAGE:    ${{ needs.build.outputs.image }}
          SHORT:    ${{ needs.build.outputs.short_sha }}
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          cd "$workdir"

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${INFRA_REPO}.git" infra
          cd infra

          git config user.name  "site-bot (${SLUG})"
          git config user.email "bot+${SLUG}@users.noreply.github.com"

          branch="image-bump/${SLUG}/${SHORT}"
          git checkout -b "$branch"

          python3 <<PY
          import pathlib, re
          p = pathlib.Path("infra/sites/${SLUG}/site.yaml")
          text = p.read_text()
          new = re.sub(
              r'^(\s*image:\s*).*$',
              lambda m: f"{m.group(1)}${IMAGE}",
              text, count=1, flags=re.MULTILINE,
          )
          if new == text:
              raise SystemExit(f"failed to rewrite image line in {p}")
          p.write_text(new)
          PY

          if git diff --quiet; then
            echo "no change (image already at this tag); skipping PR"
            exit 0
          fi

          git add "infra/sites/${SLUG}/site.yaml"
          git commit -m "image-bump(${SLUG}): ${SHORT}

          Auto-generated by ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
          git push -u origin "$branch"

          pr_url="$(gh pr create \
            --repo  "${INFRA_REPO}" \
            --base  "${INFRA_BRANCH}" \
            --head  "$branch" \
            --title "image-bump(${SLUG}): ${SHORT}" \
            --body  "Auto-generated from ${GITHUB_REPOSITORY}@\`${GITHUB_SHA}\`.\n\nDeploys \`${IMAGE}\`." \
            --label image-bump)"

          gh pr merge --repo "${INFRA_REPO}" --auto --squash "$pr_url"
          echo "::notice title=opened image-bump PR::${pr_url}"
